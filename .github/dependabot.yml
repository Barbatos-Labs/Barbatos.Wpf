# Dependabot version updates - https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Packages that must move together are grouped so one PR carries the whole set. Bumping just
# one of them fails restore with NU1605 (see Directory.Packages.props and CLAUDE.md).

version: 2
updates:
  - package-ecosystem: "nuget"
    # Central Package Management: every version lives in /Directory.Packages.props.
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Only the barbatos-wpf-app template references these, and its .template.config/
      # template.json "PackageVersion" symbol replaces that exact version literal - bump the
      # csproj and the symbol together, by hand, after each release.
      - dependency-name: "Barbatos.Wpf.*"
    groups:
      # One group, because the floors interlock across all of these:
      # - Microsoft.Extensions.AI* is pinned to ModelContextProtocol.Core's floor, and
      #   ModelContextProtocol.Core and Microsoft.Agents.AI also set floors on
      #   Microsoft.Extensions.Logging/DependencyInjection.Abstractions.
      # - Microsoft.Extensions.AI.OpenAI pins OpenAI, and OpenAI pins System.ClientModel.
      # - Microsoft.AspNetCore.SignalR.Client needs Microsoft.Extensions.* at its own patch
      #   level or higher.
      # When ModelContextProtocol.Core moves, update the floor note in Directory.Packages.props
      # and CLAUDE.md in the same PR.
      microsoft-and-ai-stack:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.SignalR.*"
          - "System.Management"
          - "ModelContextProtocol*"
          - "Microsoft.Agents.AI*"
          - "OpenAI"
          - "System.ClientModel"
          - "Anthropic"
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
          - "AwesomeAssertions"
      barbatos-i18n:
        patterns:
          - "Barbatos.i18n*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
